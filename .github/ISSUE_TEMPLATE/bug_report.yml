name: Reportar problema
description: Algo não funciona como deveria
labels: [fix]
body:
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu
      description: Descreva o problema e a mensagem de erro, se houver.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Chame POST /api/... com ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit ou versão
      placeholder: ex. v0.1.0 ou 78728e9
